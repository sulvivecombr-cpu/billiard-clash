services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:5173"   # Vite client (web entry point)
      - "8000:3001"   # Express + Socket.IO server
    environment:
      - PORT=3001
      - CLIENT_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_SERVER_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PREVIEW_MODE=1
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && npm run build:shared && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([
            fetch('http://localhost:5173/'),
            fetch('http://localhost:3001/health')
          ]).then(([a,b]) => process.exit(a.ok && b.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  app_node_modules:
